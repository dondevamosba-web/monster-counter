<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
	<title>Monster Counter</title>
	<meta name="theme-color" content="#1a1a1a">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="apple-mobile-web-app-title" content="Monster Counter">
	<style>
		* {
			margin: 0;
			padding: 0;
			box-sizing: border-box;
			-webkit-tap-highlight-color: transparent;
			-webkit-user-select: none;
			user-select: none;
		}

		:root {
			--bg: #1a1a1a;
			--panel: #2a2a2a;
			--btn: #333;
			--btn-active: #444;
			--text: #fff;
			--text-dim: #888;
			--text-dimmer: #666;
			--accent: #2a7f62;
			--accent-dark: #1d5a47;
			--accent-glow: rgba(42, 127, 98, 0.3);
			--session: #1a5c3f;
			--session-active: #0d3a25;
			--danger: #d32f2f;
			--danger-active: #b71c1c;
			--timer: #d4a72c;
			--pause: #8a6d1a;
			--pause-active: #6b5314;
		}

		html, body {
			background: var(--bg);
		}

		body {
			color: var(--text);
			font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
			font-variant-numeric: tabular-nums;
			overflow: hidden;
			width: 100%;
			height: 100vh;
			height: 100dvh;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			position: fixed;
			top: 0;
			left: 0;
		}

		@media (prefers-reduced-motion: reduce) {
			* { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; }
		}

		.container {
			display: flex;
			flex-direction: column;
			justify-content: space-between;
			align-items: center;
			width: 100%;
			height: 100%;
			padding: 20px;
			padding-top: max(20px, env(safe-area-inset-top));
			padding-bottom: max(20px, env(safe-area-inset-bottom));
		}

		.header {
			display: flex;
			justify-content: space-between;
			align-items: flex-start;
			width: 100%;
			gap: 16px;
		}

		.header-left {
			flex-shrink: 0;
		}

		.resource-row {
			display: grid;
			grid-template-columns: repeat(3, 1fr);
			gap: 10px;
			width: 100%;
			max-width: 400px;
		}

		.mini-counter {
			background: var(--panel);
			border-radius: 12px;
			padding: 10px 6px;
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 6px;
		}

		.mini-label {
			font-size: 10px;
			letter-spacing: 1px;
			font-weight: 600;
			color: var(--text-dimmer);
			text-transform: uppercase;
			white-space: nowrap;
		}

		.mini-count {
			font-size: 32px;
			font-weight: 700;
			color: var(--text);
			min-width: 32px;
			text-align: center;
		}

		.mini-buttons {
			display: flex;
			gap: 6px;
		}

		.mini-btn {
			background: var(--btn);
			border: none;
			color: var(--text);
			font-size: 14px;
			font-weight: 600;
			width: 30px;
			height: 30px;
			border-radius: 6px;
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
			transition: all 0.1s ease;
		}

		.mini-btn:active {
			background: var(--btn-active);
			transform: scale(0.9);
		}

		.decrement-btn {
			background: var(--btn);
			border: none;
			color: var(--text);
			font-size: 28px;
			font-weight: 600;
			width: 50px;
			height: 50px;
			border-radius: 8px;
			cursor: pointer;
			display: flex;
			align-items: center;
			justify-content: center;
			transition: all 0.1s ease;
		}

		.decrement-btn:active {
			background: var(--btn-active);
			transform: scale(0.95);
		}

		.counter-display {
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			gap: 10px;
		}

		.label {
			font-size: 14px;
			letter-spacing: 2px;
			font-weight: 600;
			color: var(--text-dim);
			text-transform: uppercase;
		}

		.count {
			font-size: 88px;
			font-weight: 700;
			line-height: 1;
			color: var(--text);
		}

		.stats-row {
			display: flex;
			gap: 12px;
			width: 100%;
			max-width: 340px;
		}

		.stat {
			flex: 1;
			background: var(--panel);
			border-radius: 12px;
			padding: 10px 8px;
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 4px;
		}

		.stat-label {
			font-size: 10px;
			letter-spacing: 1.5px;
			font-weight: 700;
			color: var(--text-dimmer);
			text-transform: uppercase;
		}

		.stat-value {
			font-size: 26px;
			font-weight: 700;
			color: var(--timer);
			line-height: 1.1;
		}

		.stat-value.idle {
			color: var(--text-dim);
			font-size: 20px;
			font-weight: 600;
		}

		.rate-row {
			display: grid;
			grid-template-columns: repeat(3, 1fr);
			gap: 6px 8px;
			width: 100%;
			max-width: 340px;
		}

		.rate-stat {
			flex: 1;
			background: var(--panel);
			border-radius: 10px;
			padding: 6px 4px;
			display: flex;
			flex-direction: column;
			align-items: center;
			gap: 2px;
		}

		.rate-label {
			font-size: 9px;
			letter-spacing: 1px;
			font-weight: 700;
			color: var(--text-dimmer);
			text-transform: uppercase;
		}

		.rate-value {
			font-size: 18px;
			font-weight: 700;
			color: var(--text);
			line-height: 1.1;
		}

		.action-row {
			display: flex;
			align-items: stretch;
			justify-content: center;
			gap: 10px;
			width: 100%;
			max-width: 460px;
		}

		.side-col {
			display: flex;
			flex-direction: column;
			gap: 8px;
			flex: 1;
			min-width: 0;
		}

		.main-btn {
			width: 210px;
			height: 210px;
			border-radius: 50%;
			background: linear-gradient(135deg, var(--accent) 0%, var(--accent-dark) 100%);
			border: none;
			color: var(--text);
			font-size: 42px;
			font-weight: 700;
			cursor: pointer;
			transition: all 0.05s ease;
			box-shadow: 0 8px 24px var(--accent-glow);
			display: flex;
			align-items: center;
			justify-content: center;
			letter-spacing: 1px;
		}

		.main-btn:active {
			transform: scale(0.95);
			box-shadow: 0 4px 12px var(--accent-glow);
		}

		.main-btn:disabled {
			opacity: 0.5;
		}

		.timer-display.paused {
			color: var(--pause);
		}

		.reset-btn {
			flex: 1;
			width: 100%;
			min-height: 44px;
			background: var(--btn);
			border: none;
			color: var(--text);
			font-size: 13px;
			font-weight: 700;
			padding: 6px 6px;
			border-radius: 12px;
			cursor: pointer;
			transition: all 0.1s ease;
			letter-spacing: 0.5px;
			display: flex;
			align-items: center;
			justify-content: center;
			text-align: center;
			line-height: 1.15;
		}

		.reset-btn:active {
			background: var(--btn-active);
			transform: scale(0.95);
		}

		.reset-btn:disabled {
			opacity: 0.4;
			cursor: default;
		}

		.new-session-btn {
			background: var(--session);
		}

		.new-session-btn:active {
			background: var(--session-active);
		}

		.pause-btn {
			background: var(--pause);
		}

		.pause-btn:active {
			background: var(--pause-active);
		}

		.pause-btn.active {
			background: var(--session);
		}

		.pause-btn.active:active {
			background: var(--session-active);
		}

		/* Modal Styles */
		.modal-overlay {
			position: fixed;
			top: 0;
			left: 0;
			right: 0;
			bottom: 0;
			background: rgba(0, 0, 0, 0.7);
			display: none;
			align-items: center;
			justify-content: center;
			z-index: 1000;
		}

		.modal-overlay.active {
			display: flex;
		}

		.modal {
			background: var(--panel);
			border-radius: 16px;
			padding: 32px 24px;
			text-align: center;
			max-width: 300px;
			animation: slideUp 0.2s ease;
		}

		@keyframes slideUp {
			from {
				transform: translateY(20px);
				opacity: 0;
			}
			to {
				transform: translateY(0);
				opacity: 1;
			}
		}

		.modal-title {
			font-size: 18px;
			font-weight: 600;
			margin-bottom: 20px;
			color: var(--text);
		}

		.modal-buttons {
			display: flex;
			gap: 12px;
			justify-content: center;
		}

		.modal-btn {
			flex: 1;
			padding: 12px 24px;
			border: none;
			border-radius: 8px;
			font-size: 16px;
			font-weight: 600;
			cursor: pointer;
			transition: all 0.1s ease;
		}

		.modal-btn:focus-visible,
		.mini-btn:focus-visible,
		.decrement-btn:focus-visible,
		.main-btn:focus-visible,
		.reset-btn:focus-visible {
			outline: 2px solid var(--timer);
			outline-offset: 2px;
		}

		.modal-btn.cancel {
			background: var(--btn-active);
			color: var(--text);
		}

		.modal-btn.cancel:active {
			background: #555;
			transform: scale(0.95);
		}

		.modal-btn.confirm {
			background: var(--danger);
			color: var(--text);
		}

		.modal-btn.confirm:active {
			background: var(--danger-active);
			transform: scale(0.95);
		}

		.session-summary {
			text-align: left;
			margin: 18px 0;
			font-size: 13px;
			color: #aaa;
			display: flex;
			flex-direction: column;
			gap: 6px;
		}

		.session-summary strong {
			color: var(--text);
		}

		/* Prevent double-tap zoom */
		@media (pointer: coarse) {
			body {
				touch-action: manipulation;
			}
		}

		/* Mobile optimizations */
		@media (max-width: 480px) {
			.container {
				padding: 14px;
				padding-top: max(14px, env(safe-area-inset-top));
				padding-bottom: max(14px, env(safe-area-inset-bottom));
				justify-content: space-evenly;
				gap: 16px;
			}

			.header {
				margin-top: 4px;
			}

			.decrement-btn {
				width: 56px;
				height: 56px;
				font-size: 30px;
			}

			.resource-row {
				gap: 8px;
			}

			.mini-counter {
				padding: 14px 6px;
			}

			.counter-display {
				gap: 12px;
			}

			.label {
				font-size: 13px;
			}

			.count {
				font-size: 58px;
			}

			.stats-row {
				max-width: 100%;
				gap: 14px;
			}

			.stat {
				padding: 12px 8px;
			}

			.stat-value {
				font-size: 26px;
			}

			.stat-value.idle {
				font-size: 18px;
			}

			.rate-row {
				max-width: 100%;
				gap: 8px 10px;
			}

			.rate-stat {
				padding: 8px 4px;
			}

			.rate-value {
				font-size: 21px;
			}

			.main-btn {
				width: 150px;
				height: 150px;
				font-size: 28px;
				flex-shrink: 0;
			}

			.mini-label {
				font-size: 11px;
			}

			.mini-count {
				font-size: 34px;
				min-width: 32px;
			}

			.mini-btn {
				width: 30px;
				height: 30px;
				font-size: 15px;
			}

			.action-row {
				gap: 8px;
				margin-top: 4px;
			}

			.side-col {
				gap: 6px;
			}

			.reset-btn {
				padding: 4px 4px;
				font-size: 11px;
			}
		}

		@media (max-height: 700px) {
			.container { justify-content: flex-start; gap: 8px; }
			.stat-value { font-size: 20px; }
			.main-btn { width: 120px; height: 120px; font-size: 24px; }
			.count { font-size: 38px; }
			.mini-count { font-size: 26px; }
		}
	</style>
</head>
<body>
	<div class="container">
		<div class="header">
			<div class="header-left">
				<button class="decrement-btn" id="decrementBtn" aria-label="Decrease count by 1">−1</button>
			</div>
		</div>

		<div class="resource-row">
			<div class="mini-counter">
				<div class="mini-label">Epic Drops</div>
				<div class="mini-count" id="epicsCount">0</div>
				<div class="mini-buttons">
					<button class="mini-btn" id="epicsMinusBtn" aria-label="Decrease epic drops">−</button>
					<button class="mini-btn" id="epicsPlusBtn" aria-label="Increase epic drops">+</button>
				</div>
			</div>
			<div class="mini-counter">
				<div class="mini-label">Coins</div>
				<div class="mini-count" id="coinsCount">0</div>
				<div class="mini-buttons">
					<button class="mini-btn" id="coinsMinusBtn" aria-label="Decrease coins">−</button>
					<button class="mini-btn" id="coinsPlusBtn" aria-label="Increase coins">+</button>
				</div>
			</div>
			<div class="mini-counter">
				<div class="mini-label">Common Drops</div>
				<div class="mini-count" id="commonsCount">0</div>
				<div class="mini-buttons">
					<button class="mini-btn" id="commonsMinusBtn" aria-label="Decrease common drops">−</button>
					<button class="mini-btn" id="commonsPlusBtn" aria-label="Increase common drops">+</button>
				</div>
			</div>
		</div>

		<div class="counter-display">
			<div class="label">Monsters Killed</div>
			<div class="count" id="counter">0</div>
			<div class="stats-row">
				<div class="stat">
					<div class="stat-label">Timer</div>
					<div class="stat-value idle timer-display" id="timerDisplay">Ready</div>
				</div>
				<div class="stat">
					<div class="stat-label">Avg Kill Time</div>
					<div class="stat-value idle" id="avgDisplay">—</div>
				</div>
			</div>
			<div class="rate-row">
				<div class="rate-stat">
					<div class="rate-label">Last 5m</div>
					<div class="rate-value" id="rate5Display">0</div>
				</div>
				<div class="rate-stat">
					<div class="rate-label">Last 10m</div>
					<div class="rate-value" id="rate10Display">0</div>
				</div>
				<div class="rate-stat">
					<div class="rate-label">Last 15m</div>
					<div class="rate-value" id="rate15Display">0</div>
				</div>
				<div class="rate-stat">
					<div class="rate-label">Last 30m</div>
					<div class="rate-value" id="rate30Display">0</div>
				</div>
				<div class="rate-stat">
					<div class="rate-label">Last 45m</div>
					<div class="rate-value" id="rate45Display">0</div>
				</div>
				<div class="rate-stat">
					<div class="rate-label">Last 60m</div>
					<div class="rate-value" id="rate60Display">0</div>
				</div>
			</div>
		</div>

		<div class="action-row">
			<button class="reset-btn pause-btn" id="pauseBtn">PAUSE</button>
			<button class="main-btn" id="mainBtn" aria-label="Register a kill">TAP</button>
			<div class="side-col">
				<button class="reset-btn" id="resetBtn">RESET</button>
				<button class="reset-btn new-session-btn" id="newSessionBtn">NEW SESSION</button>
			</div>
		</div>
	</div>

	<div class="modal-overlay" id="resetModal">
		<div class="modal">
			<div class="modal-title">Reset monster count?</div>
			<div class="modal-buttons">
				<button class="modal-btn cancel" id="cancelBtn">Cancel</button>
				<button class="modal-btn confirm" id="confirmResetBtn">Reset</button>
			</div>
		</div>
	</div>

	<div class="modal-overlay" id="newSessionModal">
		<div class="modal">
			<div class="modal-title">Start New Session?</div>
			<div class="session-summary">
				<div><strong>Last Session:</strong></div>
				<div>⚔ Monsters: <span id="lastMonsters">0</span></div>
				<div>✨ Epic Drops: <span id="lastEpics">0</span></div>
				<div>💰 Coins: <span id="lastCoins">0</span></div>
				<div>🎁 Common Drops: <span id="lastCommons">0</span></div>
				<div>⏱ Total Time: <span id="lastTime">—</span></div>
				<div>⚡ Avg Kill Time: <span id="lastAvg">—</span></div>
			</div>
			<div class="modal-buttons">
				<button class="modal-btn cancel" id="cancelNewSessionBtn">Cancel</button>
				<button class="modal-btn confirm" id="confirmNewSessionBtn">New Session</button>
			</div>
		</div>
	</div>

	<script>
		const STORAGE_KEY_MONSTERS = 'monsterCount';
		const STORAGE_KEY_EPICS = 'epicsCount';
		const STORAGE_KEY_COINS = 'coinsCount';
		const STORAGE_KEY_COMMONS = 'commonsCount';
		const STORAGE_KEY_START_TIME = 'killStartTime';
		const STORAGE_KEY_PAUSED = 'sessionPaused';
		const STORAGE_KEY_PAUSE_STARTED = 'pauseStartedAt';
		const STORAGE_KEY_KILL_TIMESTAMPS = 'killTimestamps';
		const AUTO_PAUSE_MS = 2 * 60 * 1000;
		const RATE_WINDOWS_MIN = [5, 10, 15, 30, 45, 60];
		const RATE_WINDOWS_MS = RATE_WINDOWS_MIN.map(m => m * 60 * 1000);
		const STORAGE_KEY_LAST_MONSTERS = 'lastMonsters';
		const STORAGE_KEY_LAST_EPICS = 'lastEpics';
		const STORAGE_KEY_LAST_COINS = 'lastCoins';
		const STORAGE_KEY_LAST_COMMONS = 'lastCommons';
		const STORAGE_KEY_LAST_TIME = 'lastTime';
		const STORAGE_KEY_LAST_AVG = 'lastAvg';
		const DEFAULT_COUNT = 0;

		let count = loadCount(STORAGE_KEY_MONSTERS);
		let epics = loadCount(STORAGE_KEY_EPICS);
		let coins = loadCount(STORAGE_KEY_COINS);
		let commons = loadCount(STORAGE_KEY_COMMONS);
		let startTime = loadTime(STORAGE_KEY_START_TIME);
		let isPaused = localStorage.getItem(STORAGE_KEY_PAUSED) === '1';
		let pauseStartedAt = loadTime(STORAGE_KEY_PAUSE_STARTED);
		let killTimestamps = loadTimestamps();
		let tickHandle = null;

		const counterDisplay = document.getElementById('counter');
		const epicsDisplay = document.getElementById('epicsCount');
		const coinsDisplay = document.getElementById('coinsCount');
		const commonsDisplay = document.getElementById('commonsCount');
		const timerDisplay = document.getElementById('timerDisplay');
		const avgDisplay = document.getElementById('avgDisplay');
		const rateDisplays = RATE_WINDOWS_MIN.map(m => document.getElementById(`rate${m}Display`));
		const mainBtn = document.getElementById('mainBtn');
		const decrementBtn = document.getElementById('decrementBtn');
		const epicsPlusBtn = document.getElementById('epicsPlusBtn');
		const epicsMinusBtn = document.getElementById('epicsMinusBtn');
		const coinsPlusBtn = document.getElementById('coinsPlusBtn');
		const coinsMinusBtn = document.getElementById('coinsMinusBtn');
		const commonsPlusBtn = document.getElementById('commonsPlusBtn');
		const commonsMinusBtn = document.getElementById('commonsMinusBtn');
		const pauseBtn = document.getElementById('pauseBtn');
		const resetBtn = document.getElementById('resetBtn');
		const newSessionBtn = document.getElementById('newSessionBtn');
		const resetModal = document.getElementById('resetModal');
		const newSessionModal = document.getElementById('newSessionModal');
		const cancelBtn = document.getElementById('cancelBtn');
		const confirmResetBtn = document.getElementById('confirmResetBtn');
		const cancelNewSessionBtn = document.getElementById('cancelNewSessionBtn');
		const confirmNewSessionBtn = document.getElementById('confirmNewSessionBtn');

		function loadCount(key) {
			const stored = localStorage.getItem(key);
			return stored !== null ? parseInt(stored, 10) : DEFAULT_COUNT;
		}

		function saveCount(key, value) {
			try { localStorage.setItem(key, value.toString()); } catch (e) {}
		}

		function loadTime(key) {
			const stored = localStorage.getItem(key);
			return stored !== null ? parseInt(stored, 10) : null;
		}

		function saveTime(key, value) {
			try {
				if (value === null) {
					localStorage.removeItem(key);
				} else {
					localStorage.setItem(key, value.toString());
				}
			} catch (e) {}
		}

		function loadTimestamps() {
			try {
				const stored = localStorage.getItem(STORAGE_KEY_KILL_TIMESTAMPS);
				const arr = stored !== null ? JSON.parse(stored) : [];
				return Array.isArray(arr) ? arr : [];
			} catch (e) {
				return [];
			}
		}

		function saveTimestamps() {
			try { localStorage.setItem(STORAGE_KEY_KILL_TIMESTAMPS, JSON.stringify(killTimestamps)); } catch (e) {}
		}

		function trimTimestamps() {
			const cutoff = Date.now() - RATE_WINDOWS_MS[RATE_WINDOWS_MS.length - 1];
			while (killTimestamps.length > 0 && killTimestamps[0] < cutoff) {
				killTimestamps.shift();
			}
		}

		function updateRates() {
			const now = isPaused && pauseStartedAt !== null ? pauseStartedAt : Date.now();
			RATE_WINDOWS_MS.forEach((windowMs, i) => {
				const cutoff = now - windowMs;
				let c = 0;
				for (let j = killTimestamps.length - 1; j >= 0; j--) {
					if (killTimestamps[j] >= cutoff) c++;
					else break;
				}
				rateDisplays[i].textContent = c;
			});
		}

		function formatDuration(ms) {
			const totalSeconds = Math.floor(ms / 1000);
			const h = Math.floor(totalSeconds / 3600);
			const m = Math.floor((totalSeconds % 3600) / 60);
			const s = totalSeconds % 60;
			const pad = n => n.toString().padStart(2, '0');
			return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
		}

		function formatAvg(ms) {
			const totalSeconds = ms / 1000;
			if (totalSeconds < 60) {
				return `${totalSeconds.toFixed(1)}s`;
			}
			const m = Math.floor(totalSeconds / 60);
			const s = Math.round(totalSeconds % 60);
			return `${m}m ${s}s`;
		}

		function updateDisplay() {
			counterDisplay.textContent = count;
			epicsDisplay.textContent = epics;
			coinsDisplay.textContent = coins;
			commonsDisplay.textContent = commons;
			updateStats();
		}

		function updateStats() {
			updateRates();

			if (!isPaused && startTime !== null && count >= 1) {
				const lastTap = killTimestamps.length ? killTimestamps[killTimestamps.length - 1] : startTime;
				if (Date.now() - lastTap >= AUTO_PAUSE_MS) {
					pauseSession();
				}
			}

			mainBtn.disabled = isPaused;
			pauseBtn.disabled = (startTime === null || count < 1) && !isPaused;
			pauseBtn.textContent = isPaused ? 'RESUME' : 'PAUSE';
			pauseBtn.classList.toggle('active', isPaused);

			if (startTime === null || count < 1) {
				timerDisplay.textContent = 'Ready';
				timerDisplay.classList.add('idle');
				timerDisplay.classList.remove('paused');
				avgDisplay.textContent = '—';
				avgDisplay.classList.add('idle');
				return;
			}

			const now = isPaused && pauseStartedAt !== null ? pauseStartedAt : Date.now();
			const elapsed = now - startTime;
			timerDisplay.textContent = (isPaused ? '⏸ ' : '') + formatDuration(elapsed);
			timerDisplay.classList.remove('idle');
			timerDisplay.classList.toggle('paused', isPaused);

			if (count >= 2) {
				const avg = elapsed / (count - 1);
				avgDisplay.textContent = formatAvg(avg);
				avgDisplay.classList.remove('idle');
			} else {
				avgDisplay.textContent = 'First kill!';
				avgDisplay.classList.add('idle');
			}
		}

		function pauseSession() {
			if (startTime === null || count < 1 || isPaused) return;
			isPaused = true;
			pauseStartedAt = Date.now();
			localStorage.setItem(STORAGE_KEY_PAUSED, '1');
			saveTime(STORAGE_KEY_PAUSE_STARTED, pauseStartedAt);
			stopTicking();
			updateStats();
		}

		function resumeSession() {
			if (!isPaused) return;
			const pauseDuration = pauseStartedAt !== null ? Date.now() - pauseStartedAt : 0;
			startTime += pauseDuration;
			saveTime(STORAGE_KEY_START_TIME, startTime);
			isPaused = false;
			pauseStartedAt = null;
			localStorage.setItem(STORAGE_KEY_PAUSED, '0');
			saveTime(STORAGE_KEY_PAUSE_STARTED, null);
			startTicking();
			updateStats();
		}

		function togglePause() {
			if (startTime === null || count < 1) return;
			if (isPaused) {
				resumeSession();
			} else {
				pauseSession();
			}
		}

		function startTicking() {
			if (tickHandle !== null) return;
			tickHandle = setInterval(updateStats, 250);
		}

		function stopTicking() {
			if (tickHandle !== null) {
				clearInterval(tickHandle);
				tickHandle = null;
			}
		}

		function incrementMonsters() {
			if (isPaused) return;
			if (startTime === null) {
				startTime = Date.now();
				saveTime(STORAGE_KEY_START_TIME, startTime);
				startTicking();
			}
			count++;
			saveCount(STORAGE_KEY_MONSTERS, count);
			killTimestamps.push(Date.now());
			trimTimestamps();
			saveTimestamps();
			updateDisplay();
		}

		function decrementMonsters() {
			if (count > 0) {
				count--;
				saveCount(STORAGE_KEY_MONSTERS, count);
				killTimestamps.pop();
				saveTimestamps();
				if (count === 0) {
					startTime = null;
					saveTime(STORAGE_KEY_START_TIME, null);
					isPaused = false;
					pauseStartedAt = null;
					localStorage.setItem(STORAGE_KEY_PAUSED, '0');
					saveTime(STORAGE_KEY_PAUSE_STARTED, null);
					stopTicking();
				}
				updateDisplay();
			}
		}

		function incrementEpics() {
			epics++;
			saveCount(STORAGE_KEY_EPICS, epics);
			updateDisplay();
		}

		function decrementEpics() {
			if (epics > 0) {
				epics--;
				saveCount(STORAGE_KEY_EPICS, epics);
				updateDisplay();
			}
		}

		function incrementCoins() {
			coins++;
			saveCount(STORAGE_KEY_COINS, coins);
			updateDisplay();
		}

		function decrementCoins() {
			if (coins > 0) {
				coins--;
				saveCount(STORAGE_KEY_COINS, coins);
				updateDisplay();
			}
		}

		function incrementCommons() {
			commons++;
			saveCount(STORAGE_KEY_COMMONS, commons);
			updateDisplay();
		}

		function decrementCommons() {
			if (commons > 0) {
				commons--;
				saveCount(STORAGE_KEY_COMMONS, commons);
				updateDisplay();
			}
		}

		function openResetModal() {
			resetModal.classList.add('active');
		}

		function closeResetModal() {
			resetModal.classList.remove('active');
		}

		function performReset() {
			count = 0;
			startTime = null;
			isPaused = false;
			pauseStartedAt = null;
			killTimestamps = [];
			saveCount(STORAGE_KEY_MONSTERS, count);
			saveTime(STORAGE_KEY_START_TIME, null);
			localStorage.setItem(STORAGE_KEY_PAUSED, '0');
			saveTime(STORAGE_KEY_PAUSE_STARTED, null);
			saveTimestamps();
			stopTicking();
			updateDisplay();
			closeResetModal();
		}

		function openNewSessionModal() {
			document.getElementById('lastMonsters').textContent = count;
			document.getElementById('lastEpics').textContent = epics;
			document.getElementById('lastCoins').textContent = coins;
			document.getElementById('lastCommons').textContent = commons;
			const now = isPaused && pauseStartedAt !== null ? pauseStartedAt : Date.now();
			const elapsed = startTime !== null ? now - startTime : 0;
			document.getElementById('lastTime').textContent = startTime !== null ? formatDuration(elapsed) : '—';
			document.getElementById('lastAvg').textContent = (startTime !== null && count >= 2) ? formatAvg(elapsed / (count - 1)) : '—';
			newSessionModal.classList.add('active');
		}

		function closeNewSessionModal() {
			newSessionModal.classList.remove('active');
		}

		function performNewSession() {
			const now = isPaused && pauseStartedAt !== null ? pauseStartedAt : Date.now();
			const elapsed = startTime !== null ? now - startTime : 0;
			saveCount(STORAGE_KEY_LAST_MONSTERS, count);
			saveCount(STORAGE_KEY_LAST_EPICS, epics);
			saveCount(STORAGE_KEY_LAST_COINS, coins);
			saveCount(STORAGE_KEY_LAST_COMMONS, commons);
			saveTime(STORAGE_KEY_LAST_TIME, startTime !== null ? elapsed : null);
			saveCount(STORAGE_KEY_LAST_AVG, (startTime !== null && count >= 2) ? Math.round(elapsed / (count - 1)) : 0);
			count = 0;
			epics = 0;
			coins = 0;
			commons = 0;
			startTime = null;
			isPaused = false;
			pauseStartedAt = null;
			killTimestamps = [];
			saveCount(STORAGE_KEY_MONSTERS, count);
			saveCount(STORAGE_KEY_EPICS, epics);
			saveCount(STORAGE_KEY_COINS, coins);
			saveCount(STORAGE_KEY_COMMONS, commons);
			saveTime(STORAGE_KEY_START_TIME, null);
			localStorage.setItem(STORAGE_KEY_PAUSED, '0');
			saveTime(STORAGE_KEY_PAUSE_STARTED, null);
			saveTimestamps();
			stopTicking();
			updateDisplay();
			closeNewSessionModal();
		}

		mainBtn.addEventListener('click', incrementMonsters);
		decrementBtn.addEventListener('click', decrementMonsters);
		epicsPlusBtn.addEventListener('click', incrementEpics);
		epicsMinusBtn.addEventListener('click', decrementEpics);
		coinsPlusBtn.addEventListener('click', incrementCoins);
		coinsMinusBtn.addEventListener('click', decrementCoins);
		commonsPlusBtn.addEventListener('click', incrementCommons);
		commonsMinusBtn.addEventListener('click', decrementCommons);
		pauseBtn.addEventListener('click', togglePause);
		resetBtn.addEventListener('click', openResetModal);
		newSessionBtn.addEventListener('click', openNewSessionModal);
		cancelBtn.addEventListener('click', closeResetModal);
		confirmResetBtn.addEventListener('click', performReset);
		cancelNewSessionBtn.addEventListener('click', closeNewSessionModal);
		confirmNewSessionBtn.addEventListener('click', performNewSession);

		// Close modals when clicking outside
		resetModal.addEventListener('click', function (e) {
			if (e.target === resetModal) {
				closeResetModal();
			}
		});

		newSessionModal.addEventListener('click', function (e) {
			if (e.target === newSessionModal) {
				closeNewSessionModal();
			}
		});

		// Initialize display and resume timer if a session was already running
		trimTimestamps();
		saveTimestamps();
		updateDisplay();
		if (startTime !== null && count > 0 && !isPaused) {
			startTicking();
		}

		// Disable scrolling and zooming
		document.addEventListener('touchmove', function (e) {
			if (e.target === document.body) {
				e.preventDefault();
			}
		}, { passive: false });

		// Prevent accidental text selection on repeated taps
		document.addEventListener('touchstart', function (e) {
			if (e.touches.length > 1) {
				e.preventDefault();
			}
		}, { passive: false });
	</script>
</body>
</html>
